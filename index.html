<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Arbeitszeit Stempeluhr</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      padding: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(30px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }

    .container { width: 100%; max-width: 720px; margin: 0 auto; }
    .hidden { display: none !important; }

    h1 { font-size: 28px; margin: 5px 0 4px; }
    h2 { font-size: 20px; margin-top: 0; }
    .subtitle { color: #6b7280; margin: 0 0 18px; font-size: 15px; }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    }

    .auth-card { max-width: 480px; margin: 8vh auto 0; }
    .auth-card h1 { margin-bottom: 8px; }
    .auth-card p { color: #6b7280; margin-top: 0; }

    label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }

    input {
      width: 100%; min-height: 50px; padding: 12px 14px;
      border: 1px solid #d1d5db; border-radius: 12px;
      font-size: 16px; background: #fff; color: #111827;
    }
    input:focus { outline: 3px solid rgba(37,99,235,.15); border-color: #2563eb; }

    button {
      width: 100%; min-height: 52px; border: 0; border-radius: 12px;
      padding: 14px 18px; font-size: 17px; font-weight: 700;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    button:disabled { opacity: .6; cursor: wait; }
    button:active { transform: scale(.99); }

    .primary { background: #2563eb; color: white; }
    .secondary { background: #e5e7eb; color: #374151; }
    .danger { background: #dc2626; color: white; }
    .btn-start { background: #16a34a; color: white; }
    .btn-stop { background: #dc2626; color: white; }

    .auth-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .message { min-height: 22px; margin-top: 12px; font-size: 14px; color: #b91c1c; }
    .message.success { color: #15803d; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .topbar-info { min-width: 0; }
    .user-email { color: #6b7280; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
    .logout-button { width: auto; min-height: 40px; padding: 8px 12px; font-size: 14px; background: #e5e7eb; color: #374151; }

    .clock { font-size: clamp(38px, 12vw, 58px); font-weight: 750; text-align: center; letter-spacing: -1px; margin-top: 5px; }
    .date { text-align: center; color: #6b7280; margin: 4px 0 24px; font-size: 15px; }
    .status { text-align: center; font-size: 17px; margin-bottom: 18px; }
    .status.working { color: #15803d; font-weight: 700; }
    #stampButton { min-height: 66px; border-radius: 16px; font-size: 20px; }
    .current-start { text-align: center; margin-top: 15px; min-height: 20px; color: #6b7280; font-size: 15px; }
    .sync-note { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 8px; }

    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .summary-box { background: #fff; padding: 18px 10px; border-radius: 16px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04); }
    .summary-value { font-size: clamp(23px, 7vw, 30px); font-weight: 750; }
    .summary-label { color: #6b7280; margin-top: 5px; font-size: 14px; }

    .entry { padding: 17px 0; border-bottom: 1px solid #e5e7eb; }
    .entry:last-child { border-bottom: none; }
    .entry-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
    .entry-date { font-weight: 650; font-size: 15px; }
    .entry-duration { font-weight: 750; color: #2563eb; white-space: nowrap; }
    .entry-times { color: #6b7280; font-size: 15px; }
    .empty { color: #6b7280; text-align: center; padding: 25px 10px; }
    .delete-button { width: auto; min-height: 38px; padding: 8px 12px; margin-top: 12px; font-size: 13px; background: #f3f4f6; color: #6b7280; }

    @media (max-width: 480px) {
      body { padding-left: 12px; padding-right: 12px; }
      h1 { font-size: 25px; }
      .card { border-radius: 16px; padding: 18px 16px; }
      .entry-header { align-items: flex-start; }
      .user-email { max-width: 180px; }
    }

    @media (max-width: 350px) {
      .summary, .auth-actions { grid-template-columns: 1fr; }
      .clock { font-size: 35px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <section id="authView" class="card auth-card">
      <h1>Stempeluhr Login</h1>
      <p>Melde dich an, damit deine Arbeitszeiten auf allen Geräten synchron sind.</p>

      <label for="email">E-Mail</label>
      <input id="email" type="email" autocomplete="email" placeholder="name@beispiel.de">

      <label for="password">Passwort</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Mindestens 6 Zeichen">

      <div class="auth-actions">
        <button id="loginButton" class="primary" onclick="signIn()">Anmelden</button>
        <button id="registerButton" class="secondary" onclick="signUp()">Registrieren</button>
      </div>

      <div id="authMessage" class="message"></div>
    </section>

    <main id="appView" class="hidden">
      <div class="topbar">
        <div class="topbar-info">
          <h1>Meine Arbeitszeit</h1>
          <div id="userEmail" class="user-email"></div>
        </div>
        <button class="logout-button" onclick="signOut()">Abmelden</button>
      </div>

      <p class="subtitle">Cloud-synchronisierte digitale Stempeluhr</p>

      <div class="card">
        <div id="clock" class="clock"></div>
        <div id="todayDate" class="date"></div>

        <div id="status" class="status">Aktuell nicht eingestempelt</div>
        <button id="stampButton" class="btn-start" onclick="handleStamp()">Einstempeln</button>
        <div id="currentStart" class="current-start"></div>
        <div id="syncNote" class="sync-note">Synchronisiert mit der Cloud</div>
      </div>

      <div class="summary">
        <div class="summary-box">
          <div id="todayHours" class="summary-value">0:00 h</div>
          <div class="summary-label">Heute</div>
        </div>
        <div class="summary-box">
          <div id="weekHours" class="summary-value">0:00 h</div>
          <div class="summary-label">Diese Woche</div>
        </div>
      </div>

      <div class="card">
        <h2>Arbeitszeiten</h2>
        <div id="entries"></div>
      </div>
    </main>
  </div>

  <script>
    // ------------------------------------------------------------
    // 1) HIER DEINE SUPABASE-DATEN EINTRAGEN
    // ------------------------------------------------------------
    const SUPABASE_URL = "https://DEIN-PROJEKT.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "DEIN_PUBLISHABLE_KEY";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    let currentUser = null;
    let workSessions = [];
    let currentSession = null;
    let busy = false;
    let lastSync = null;

    function setAuthMessage(text, success = false) {
      const el = document.getElementById("authMessage");
      el.textContent = text || "";
      el.className = success ? "message success" : "message";
    }

    function getCredentials() {
      return {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };
    }

    async function signIn() {
      const { email, password } = getCredentials();
      if (!email || !password) {
        setAuthMessage("Bitte E-Mail und Passwort eingeben.");
        return;
      }

      setAuthBusy(true);
      setAuthMessage("");
      const { error } = await db.auth.signInWithPassword({ email, password });
      setAuthBusy(false);

      if (error) setAuthMessage("Anmeldung fehlgeschlagen: " + error.message);
    }

    async function signUp() {
      const { email, password } = getCredentials();
      if (!email || password.length < 6) {
        setAuthMessage("Bitte eine gültige E-Mail und ein Passwort mit mindestens 6 Zeichen eingeben.");
        return;
      }

      setAuthBusy(true);
      setAuthMessage("");
      const { data, error } = await db.auth.signUp({ email, password });
      setAuthBusy(false);

      if (error) {
        setAuthMessage("Registrierung fehlgeschlagen: " + error.message);
        return;
      }

      if (data.session) {
        setAuthMessage("Konto erstellt und angemeldet.", true);
      } else {
        setAuthMessage("Konto erstellt. Bitte bestätige ggf. die E-Mail und melde dich danach an.", true);
      }
    }

    async function signOut() {
      await db.auth.signOut();
    }

    function setAuthBusy(value) {
      document.getElementById("loginButton").disabled = value;
      document.getElementById("registerButton").disabled = value;
    }

    async function applySession(session) {
      currentUser = session?.user || null;

      if (!currentUser) {
        workSessions = [];
        currentSession = null;
        document.getElementById("authView").classList.remove("hidden");
        document.getElementById("appView").classList.add("hidden");
        return;
      }

      document.getElementById("authView").classList.add("hidden");
      document.getElementById("appView").classList.remove("hidden");
      document.getElementById("userEmail").textContent = currentUser.email || "Angemeldet";
      await loadSessions();
    }

    async function loadSessions() {
      if (!currentUser || busy) return;

      busy = true;
      try {
        const { data, error } = await db
          .from("work_sessions")
          .select("id, start_time, end_time")
          .order("start_time", { ascending: false })
          .limit(250);

        if (error) throw error;

        workSessions = data || [];
        currentSession = workSessions.find(s => s.end_time === null) || null;
        lastSync = new Date();
        updateUI();
      } catch (error) {
        console.error(error);
        document.getElementById("syncNote").textContent = "Synchronisierung fehlgeschlagen: " + error.message;
      } finally {
        busy = false;
      }
    }

    async function handleStamp() {
      if (!currentUser || busy) return;

      busy = true;
      const button = document.getElementById("stampButton");
      button.disabled = true;

      try {
        if (!currentSession) {
          const { error } = await db
            .from("work_sessions")
            .insert({
              user_id: currentUser.id,
              start_time: new Date().toISOString()
            });

          if (error) throw error;
        } else {
          const { error } = await db
            .from("work_sessions")
            .update({ end_time: new Date().toISOString() })
            .eq("id", currentSession.id)
            .is("end_time", null);

          if (error) throw error;
        }
      } catch (error) {
        alert("Speichern fehlgeschlagen: " + error.message);
      } finally {
        busy = false;
        button.disabled = false;
        await loadSessions();
      }
    }

    async function deleteEntry(id) {
      if (!confirm("Möchtest du diesen Arbeitszeiteintrag wirklich löschen?")) return;

      const { error } = await db
        .from("work_sessions")
        .delete()
        .eq("id", id);

      if (error) {
        alert("Löschen fehlgeschlagen: " + error.message);
        return;
      }

      await loadSessions();
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString("de-DE", {
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
      document.getElementById("todayDate").textContent = now.toLocaleDateString("de-DE", {
        weekday: "long", day: "2-digit", month: "long", year: "numeric"
      });
    }

    function updateUI() {
      if (!currentUser) return;

      const button = document.getElementById("stampButton");
      const status = document.getElementById("status");
      const currentStartText = document.getElementById("currentStart");

      if (currentSession) {
        const start = new Date(currentSession.start_time);
        button.textContent = "Ausstempeln";
        button.className = "btn-stop";
        status.textContent = "Du bist aktuell eingestempelt";
        status.className = "status working";
        currentStartText.textContent = "Eingestempelt seit: " + formatTime(start);
      } else {
        button.textContent = "Einstempeln";
        button.className = "btn-start";
        status.textContent = "Aktuell nicht eingestempelt";
        status.className = "status";
        currentStartText.textContent = "";
      }

      button.disabled = busy;
      renderEntries();
      updateSummary();

      if (lastSync) {
        document.getElementById("syncNote").textContent = "Zuletzt synchronisiert: " + formatTime(lastSync);
      }
    }

    function renderEntries() {
      const container = document.getElementById("entries");
      const completed = workSessions.filter(s => s.end_time !== null);

      if (completed.length === 0) {
        container.innerHTML = '<div class="empty">Noch keine abgeschlossenen Arbeitszeiten vorhanden.</div>';
        return;
      }

      container.innerHTML = "";

      completed.forEach(session => {
        const start = new Date(session.start_time);
        const end = new Date(session.end_time);
        const duration = Math.max(0, end.getTime() - start.getTime());

        const entry = document.createElement("div");
        entry.className = "entry";
        entry.innerHTML = `
          <div class="entry-header">
            <div class="entry-date">${formatDate(start)}</div>
            <div class="entry-duration">${formatDuration(duration)}</div>
          </div>
          <div class="entry-times">${formatTime(start)} – ${formatTime(end)}</div>
          <button class="delete-button" onclick="deleteEntry('${session.id}')">Eintrag löschen</button>
        `;
        container.appendChild(entry);
      });
    }

    function updateSummary() {
      if (!currentUser) return;

      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const tomorrowStart = new Date(todayStart);
      tomorrowStart.setDate(tomorrowStart.getDate() + 1);

      const weekStart = new Date(todayStart);
      const day = weekStart.getDay();
      const difference = day === 0 ? 6 : day - 1;
      weekStart.setDate(weekStart.getDate() - difference);

      let todayMilliseconds = 0;
      let weekMilliseconds = 0;

      workSessions.forEach(session => {
        const start = new Date(session.start_time);
        const end = session.end_time ? new Date(session.end_time) : now;

        todayMilliseconds += overlapMilliseconds(start, end, todayStart, tomorrowStart);
        weekMilliseconds += overlapMilliseconds(start, end, weekStart, now);
      });

      document.getElementById("todayHours").textContent = formatDuration(todayMilliseconds);
      document.getElementById("weekHours").textContent = formatDuration(weekMilliseconds);
    }

    function overlapMilliseconds(start, end, rangeStart, rangeEnd) {
      const from = Math.max(start.getTime(), rangeStart.getTime());
      const to = Math.min(end.getTime(), rangeEnd.getTime());
      return Math.max(0, to - from);
    }

    function formatDate(date) {
      return date.toLocaleDateString("de-DE", {
        weekday: "short", day: "2-digit", month: "2-digit", year: "numeric"
      });
    }

    function formatTime(date) {
      return date.toLocaleTimeString("de-DE", {
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
    }

    function formatDuration(milliseconds) {
      const totalMinutes = Math.floor(milliseconds / 60000);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      return hours + ":" + String(minutes).padStart(2, "0") + " h";
    }

    // Auth-Status beim Laden und nach Login/Logout übernehmen.
    db.auth.onAuthStateChange((_event, session) => {
      setTimeout(() => applySession(session), 0);
    });

    db.auth.getSession().then(({ data }) => applySession(data.session));

    updateClock();
    setInterval(() => {
      updateClock();
      if (currentUser) updateSummary();
    }, 1000);

    // Andere Geräte / Tabs werden automatisch regelmäßig abgeglichen.
    setInterval(() => {
      if (currentUser && document.visibilityState === "visible") loadSessions();
    }, 10000);

    window.addEventListener("focus", () => {
      if (currentUser) loadSessions();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && currentUser) loadSessions();
    });
  </script>
</body>
</html>
