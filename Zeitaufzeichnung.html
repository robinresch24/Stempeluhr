<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arbeitszeit Stempeluhr</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #6b7280;
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
    }

    .clock {
      font-size: 36px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 5px;
    }

    .date {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .status {
      text-align: center;
      font-size: 18px;
      margin-bottom: 20px;
    }

    .status.working {
      color: #15803d;
      font-weight: bold;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start {
      background: #16a34a;
      color: white;
    }

    .btn-start:hover {
      background: #15803d;
    }

    .btn-stop {
      background: #dc2626;
      color: white;
    }

    .btn-stop:hover {
      background: #b91c1c;
    }

    .current-start {
      text-align: center;
      margin-top: 15px;
      color: #6b7280;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .summary-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
    }

    .summary-value {
      font-size: 28px;
      font-weight: bold;
    }

    .summary-label {
      color: #6b7280;
      margin-top: 5px;
    }

    .entry {
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 0;
    }

    .entry:last-child {
      border-bottom: none;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 8px;
    }

    .entry-date {
      font-weight: bold;
    }

    .entry-duration {
      font-weight: bold;
      color: #2563eb;
    }

    .entry-times {
      color: #6b7280;
    }

    .empty {
      color: #6b7280;
      text-align: center;
      padding: 20px;
    }

    .delete-button {
      width: auto;
      padding: 6px 10px;
      margin-top: 10px;
      font-size: 12px;
      background: #e5e7eb;
      color: #374151;
    }

    .delete-button:hover {
      background: #d1d5db;
    }

    @media (max-width: 600px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .clock {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Meine Arbeitszeit</h1>
  <p class="subtitle">Einfache digitale Stempeluhr</p>

  <!-- Stempeluhr -->
  <div class="card">

    <div id="clock" class="clock"></div>
    <div id="todayDate" class="date"></div>

    <div id="status" class="status">
      Aktuell nicht eingestempelt
    </div>

    <button
      id="stampButton"
      class="btn-start"
      onclick="handleStamp()"
    >
      Einstempeln
    </button>

    <div
      id="currentStart"
      class="current-start"
    ></div>

  </div>

  <!-- Zusammenfassung -->
  <div class="summary">

    <div class="summary-box">
      <div
        id="todayHours"
        class="summary-value"
      >
        0:00 h
      </div>

      <div class="summary-label">
        Heute
      </div>
    </div>

    <div class="summary-box">
      <div
        id="weekHours"
        class="summary-value"
      >
        0:00 h
      </div>

      <div class="summary-label">
        Diese Woche
      </div>
    </div>

  </div>

  <!-- Liste -->
  <div class="card">

    <h2>Arbeitszeiten</h2>

    <div id="entries"></div>

  </div>

</div>


<script>

  /*
   * Gespeicherte Arbeitszeiten laden
   */
  let workSessions =
    JSON.parse(localStorage.getItem("workSessions")) || [];

  /*
   * Prüfen, ob aktuell eingestempelt
   */
  let currentStart =
    localStorage.getItem("currentWorkStart");



  /*
   * Aktuelle Uhrzeit anzeigen
   */
  function updateClock() {

    const now = new Date();

    document.getElementById("clock").textContent =
      now.toLocaleTimeString("de-DE", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

    document.getElementById("todayDate").textContent =
      now.toLocaleDateString("de-DE", {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      });

  }



  /*
   * Einstempeln / Ausstempeln
   */
  function handleStamp() {

    if (!currentStart) {

      // EINSTEMPELN
      const now = new Date();

      currentStart = now.toISOString();

      localStorage.setItem(
        "currentWorkStart",
        currentStart
      );

    } else {

      // AUSSTEMPELN
      const end = new Date();

      const start =
        new Date(currentStart);

      const duration =
        end.getTime() - start.getTime();


      // Arbeitszeit speichern
      workSessions.push({
        id: Date.now(),
        start: currentStart,
        end: end.toISOString(),
        duration: duration
      });


      localStorage.setItem(
        "workSessions",
        JSON.stringify(workSessions)
      );


      // Aktuelle Sitzung entfernen
      localStorage.removeItem(
        "currentWorkStart"
      );

      currentStart = null;

    }

    updateUI();

  }



  /*
   * Oberfläche aktualisieren
   */
  function updateUI() {

    const button =
      document.getElementById("stampButton");

    const status =
      document.getElementById("status");

    const currentStartText =
      document.getElementById("currentStart");


    if (currentStart) {

      const start =
        new Date(currentStart);

      button.textContent =
        "Ausstempeln";

      button.className =
        "btn-stop";

      status.textContent =
        "Du bist aktuell eingestempelt";

      status.className =
        "status working";

      currentStartText.textContent =
        "Eingestempelt seit: " +
        formatTime(start);

    } else {

      button.textContent =
        "Einstempeln";

      button.className =
        "btn-start";

      status.textContent =
        "Aktuell nicht eingestempelt";

      status.className =
        "status";

      currentStartText.textContent =
        "";

    }


    renderEntries();
    updateSummary();

  }



  /*
   * Liste aller Arbeitszeiten anzeigen
   */
  function renderEntries() {

    const container =
      document.getElementById("entries");

    container.innerHTML = "";


    if (workSessions.length === 0) {

      container.innerHTML =
        '<div class="empty">Noch keine Arbeitszeiten vorhanden.</div>';

      return;

    }


    // Neueste zuerst
    const sorted =
      [...workSessions].sort(
        (a, b) =>
          new Date(b.start) -
          new Date(a.start)
      );


    sorted.forEach(session => {

      const start =
        new Date(session.start);

      const end =
        new Date(session.end);


      const entry =
        document.createElement("div");

      entry.className = "entry";


      entry.innerHTML = `

        <div class="entry-header">

          <div class="entry-date">
            ${formatDate(start)}
          </div>

          <div class="entry-duration">
            ${formatDuration(session.duration)}
          </div>

        </div>

        <div class="entry-times">

          ${formatTime(start)}
          –
          ${formatTime(end)}

        </div>

        <button
          class="delete-button"
          onclick="deleteEntry(${session.id})"
        >
          Eintrag löschen
        </button>

      `;

      container.appendChild(entry);

    });

  }



  /*
   * Zusammenfassung Heute / Woche
   */
  function updateSummary() {

    const now =
      new Date();

    let todayMilliseconds = 0;
    let weekMilliseconds = 0;


    const todayStart =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );


    /*
     * Beginn der aktuellen Woche
     * Montag = erster Tag
     */
    const weekStart =
      new Date(todayStart);

    const day =
      weekStart.getDay();

    const difference =
      day === 0 ? 6 : day - 1;

    weekStart.setDate(
      weekStart.getDate() - difference
    );


    workSessions.forEach(session => {

      const start =
        new Date(session.start);


      if (start >= todayStart) {

        todayMilliseconds +=
          session.duration;

      }


      if (start >= weekStart) {

        weekMilliseconds +=
          session.duration;

      }

    });


    /*
     * Wenn aktuell gearbeitet wird,
     * laufende Zeit hinzurechnen
     */
    if (currentStart) {

      const currentStartDate =
        new Date(currentStart);

      const runningDuration =
        now.getTime() -
        currentStartDate.getTime();


      if (currentStartDate >= todayStart) {

        todayMilliseconds +=
          runningDuration;

      }


      if (currentStartDate >= weekStart) {

        weekMilliseconds +=
          runningDuration;

      }

    }


    document.getElementById(
      "todayHours"
    ).textContent =
      formatDuration(todayMilliseconds);


    document.getElementById(
      "weekHours"
    ).textContent =
      formatDuration(weekMilliseconds);

  }



  /*
   * Einzelnen Eintrag löschen
   */
  function deleteEntry(id) {

    const confirmed =
      confirm(
        "Möchtest du diesen Arbeitszeiteintrag wirklich löschen?"
      );

    if (!confirmed) {
      return;
    }


    workSessions =
      workSessions.filter(
        session =>
          session.id !== id
      );


    localStorage.setItem(
      "workSessions",
      JSON.stringify(workSessions)
    );


    updateUI();

  }



  /*
   * Datum formatieren
   */
  function formatDate(date) {

    return date.toLocaleDateString(
      "de-DE",
      {
        weekday: "short",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }
    );

  }



  /*
   * Uhrzeit formatieren
   */
  function formatTime(date) {

    return date.toLocaleTimeString(
      "de-DE",
      {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );

  }



  /*
   * Millisekunden in Stunden + Minuten
   *
   * Beispiel:
   * 8 Stunden 32 Minuten
   * -> 8:32 h
   */
  function formatDuration(milliseconds) {

    const totalMinutes =
      Math.floor(
        milliseconds / 1000 / 60
      );

    const hours =
      Math.floor(
        totalMinutes / 60
      );

    const minutes =
      totalMinutes % 60;


    return (
      hours +
      ":" +
      String(minutes).padStart(2, "0") +
      " h"
    );

  }



  /*
   * Start
   */
  updateClock();
  updateUI();


  /*
   * Uhr jede Sekunde aktualisieren
   */
  setInterval(() => {

    updateClock();

    if (currentStart) {
      updateSummary();
    }

  }, 1000);

</script>

</body>
</html>
